[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools",
    "wheel",
]

[project]
name = "ensembl-prodinf-core"
description = "Ensembl Production Shared libraries used across other production python packages"
requires-python = ">=3.10"
dynamic = ["version"]
readme = "README.md"
authors = [
    { name = "Marc Chakiachvili", email = "mchakiachvili@ebi.ac.uk" },
    { name = "James Allen", email = "jallen@ebi.ac.uk" },
    { name = "Luca Da Rin Fioretto", email = "ldrf@ebi.ac.uk" },
    { name = "Vinay Kaikala", email = "vkaikala@ebi.ac.uk" },
]
maintainers = [
    { name = "Ensembl Production Team", email = "ensembl-production@ebi.ac.uk" },
]
license = { text = "Apache License 2.0" }
keywords = [
    "ensembl",
    "production",
    "core",
    "sqlalchemy",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: System :: Distributed Computing",
]
# SQLAlchemy 1.4 has no Python 3.12 support (classifiers cap at 3.11); bumped to
# the 2.x line - declarative_base import and raw-string session.execute() calls
# were updated in src/ accordingly. elasticsearch bumped from the 6.8.2-era
# client (Python <=3.6 only) to 8.16+, and es.py was rewritten for its API
# (basic_auth, URL-style hosts, client.close()) - verify against your ES server.
dependencies = [
    "certifi>=2020.12.5",
    "deprecation~=2.1.0",
    "kombu>=5.4.0",
    "PyYAML>=6.0.2",
    "requests>=2.25,<3",
    "SQLAlchemy~=2.0",
    "SQLAlchemy-Utils>=0.42.0",
    "urllib3>=2.2.0",
    "elasticsearch>=8.16,<9.0",
]

[project.urls]
Homepage = "https://www.ensembl.org"
Repository = "https://github.com/Ensembl/ensembl-prodinf-core"
Issues = "https://github.com/Ensembl/ensembl-prodinf-core/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "coverage",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "_version.__version__" }

[tool.black]
line-length = 110

[tool.pylint.main]
max-line-length = 110
disable = [
    "invalid-name",
    "logging-fstring-interpolation",
    "similarities",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "unspecified-encoding",
    "wildcard-import",
]
[tool.mypy]
mypy_path = "src/test"
explicit_package_bases = true
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["src/test"]
log_cli_level = "DEBUG"
addopts = [
    "--import-mode=importlib",
    "--tb=native",
]
norecursedirs = ["docs", "*.egg_info"]


[tool.coverage.report]
exclude_also = [
    # Do not complain about missing debug-only code
    "def __repr__",
    "if self\\.debug",
    "if settings\\.DEBUG",
    # Do not complain if tests do not hit defensive assertion code
    "raise AssertionError",
    "raise NotImplementedError",
    # Do not complain if non-runnable code is not run
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def main",
    "def .*_cli",
    # Do not complain about abstract methods, they are not run
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.run]
source = ["src/test"]
